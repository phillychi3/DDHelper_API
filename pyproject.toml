[project]
name = "ddhelper-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alive-progress>=3.1.0",
    "coloredlogs>=15.0.0",
    "fastapi>=0.95.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=0.4.0",
    "pydantic>=1.10.0",
    "pymongo>=4.0.0",
    "python-dateutil>=2.8.0",
    "pytz>=2021.1",
    "pyyaml>=6.0",
    "requests>=2.25.0",
    "tqdm>=4.60.0",
    "uvicorn>=0.21.0",
    "youtube-lv>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "UP"]
fixable = ["ALL"]
