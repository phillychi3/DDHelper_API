# VTuber Tracker System Configuration

# MongoDB connection string
database: ""

# YouTube API key - Get from Google Cloud Console
youtube_api_key: ""
disable_api: false # Set to true to completely disable API and only use scraping

# API call limits to manage YouTube API quota
# YouTube API quota is measured in units, with a default limit of 10,000 units per day
# Each API request costs a different amount of quota units:
# - channels.list: 1 unit per request
# - search.list: 100 units per request
# - videos.list: 1 unit per request
#
# Set these values based on your YouTube API quota allocation
max_api_calls_per_day: 10000 # For backwards compatibility
max_api_units_per_day: 10000 # Daily API quota units

# API server settings
api_host: "0.0.0.0"
api_port: 7600
api_only_mode: false # Set to true to run only API server without tracker controller
dev_mode: false # Set to true to enable management and debug routes (local development only)

# Logging settings
log_level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL

# Update intervals (in seconds)
live_check_interval: 600 # 10 minutes
channel_update_interval: 86400 # 24 hours
video_analysis_interval: 21600 # 6 hours
