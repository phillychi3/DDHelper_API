<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous">
    </script>
</head>

<body>
    <div>
        <form method="post" action="http://localhost:5000/addimage" enctype="multipart/form-data">
            <input class="form-control" type="file" id="formFile" name="photo" />
            <br>
            <select class="form-select form-select-lg mb-3" aria-label=".form-select-lg example" name="tag">
                <option selected>請選擇一項類別</option>
                <option value="holostar">holostar</option>
                <option value="hololive">hololive</option>
                <option value="other">other</option>
            </select>

            <label for="inputAddress" class="form-label">自選分類</label>
            <input type="text" class="form-control" name="selftag" id="inputAddress" placeholder="example: fbk">
            <br>

            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" value="True" name="isnsfw" type="checkbox" id="gridCheck">
                    <label class="form-check-label" for="gridCheck">
                        is nsfw
                    </label>
                </div>
            </div>
            <br>



            <button type="submit" class="btn btn-primary">上傳</button>


        </form>
    </div>
</body>

</html>
